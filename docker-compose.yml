services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guess43}
      POSTGRES_USER: ${POSTGRES_USER:-guess43}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guess43_dev}
    ports:
      - '5432:5432'
    volumes:
      - guess43-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-guess43} -d ${POSTGRES_DB:-guess43}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-guess43};Username=${POSTGRES_USER:-guess43};Password=${POSTGRES_PASSWORD:-guess43_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in your .env}
      Jwt__Issuer: guess43
      Jwt__Audience: guess43-client
      Database__MigrateOnStartup: 'true'
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  guess43-db:
