sonar.projectKey=guess43
sonar.projectName=Guess43

# Sources & tests
sonar.sources=src/backend,src/frontend/guess43-web/src
sonar.tests=tests,src/frontend/guess43-web/src
sonar.test.inclusions=**/*Tests.cs,**/*.test.ts,**/*.test.tsx

# Language-specific coverage reports
sonar.cs.vscoveragexml.reportsPaths=coverage/**/coverage.cobertura.xml
sonar.javascript.lcov.reportPaths=src/frontend/guess43-web/coverage/lcov.info

# Exclusions: generated migrations, build output, and node_modules are not testable code.
sonar.exclusions=**/Migrations/**,**/bin/**,**/obj/**,**/dist/**,**/node_modules/**
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/*.test.ts,**/*.test.tsx,**/test/**,**/e2e/**

sonar.sourceEncoding=UTF-8
